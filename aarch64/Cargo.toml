cargo-features = ["per-package-target"]

[package]
name = "aarch64"
version = "0.1.0"
edition = "2024"
default-target = "aarch64-unknown-none"

[dependencies]
aarch64-cpu = "11.2"
bitstruct = "0.1"
port = { path = "../port" }
r9-sys = { path = "../sys" }
num_enum = { version = "0.7", default-features = false }

[features]
# Exit QEMU through semihosting when the kernel is done, for the smoke test.
# QEMU only: on hardware without a debugger, the call is an undefined
# instruction.
semihosting = []
